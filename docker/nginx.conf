server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Proxy the OpenAI-compatible and native Ollama APIs through the same
    # origin as the UI, so the page can just call relative "/v1/..." with no
    # CORS/base-URL configuration needed.
    location ~ ^/(v1|api)/ {
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Required for token-by-token streaming (SSE) to reach the browser
        # as it's generated instead of arriving all at once at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Usage-tracking dashboard and chat-storage APIs, both served by the same
    # proxy (docker/proxy.py), backed by Postgres.
    location /_usage/ {
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /_chats/ {
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
